name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      storage:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: triage
          RUSTFS_SECRET_KEY: triage-secret
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Wait for object storage
        run: timeout 60 bash -c 'until curl -sf http://localhost:9000/health; do sleep 2; done'
      - run: pnpm test
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY_ID: triage
          S3_SECRET_ACCESS_KEY: triage-secret
